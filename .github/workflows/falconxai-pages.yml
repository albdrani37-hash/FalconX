name: Publish FalconXAI website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/falconxai-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "falconxai-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
